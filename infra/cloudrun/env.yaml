# Variáveis de ambiente do serviço no Cloud Run (não secretas).
# Usado por: gcloud run deploy ... --env-vars-file infra/cloudrun/env.yaml
# Segredos (SECRET_KEY, DATABASE_URL, chaves do R2, ORIGIN_SECRET) ficam no
# Secret Manager e entram pelo --set-secrets (ver docs/deploy.md).
DEBUG: "False"
USE_X_FORWARDED_HOST: "True"
ALLOWED_HOSTS: "gustavolocks.com.br,www.gustavolocks.com.br"
CSRF_TRUSTED_ORIGINS: "https://gustavolocks.com.br,https://www.gustavolocks.com.br"
R2_BUCKET_NAME: "gustavo-locks-fotos"
# Troque <ID-DA-CONTA> pelo ID da conta do Cloudflare (painel do R2).
R2_ENDPOINT_URL: "https://<ID-DA-CONTA>.r2.cloudflarestorage.com"
