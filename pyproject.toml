[project]
name = "site-gustavo"
version = "0.1.0"
description = "Site do artista: divulgação do trabalho e pedidos de orçamento pelo WhatsApp"
readme = "README.md"
authors = [
    { name = "Marcus", email = "eng.marcusgoulart@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "django-environ>=0.14.0",
    "django-storages[s3]>=1.14.6",
    "django-tailwind-cli>=4.8.2",
    "gunicorn>=27.0.1",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.9",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# Migrações são geradas pelo Django: não vale a pena lintar nem formatar.
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# Conjuntos de regras ativados (o padrão do ruff é só E e F):
# E/W  pycodestyle: estilo básico (espaços, indentação)
# F    pyflakes: erros prováveis (import não usado, variável indefinida)
# I    isort: ordem dos imports
# B    bugbear: armadilhas comuns do Python
# UP   pyupgrade: troca sintaxe antiga pela do Python 3.13
# DJ   flake8-django: boas práticas específicas do Django
select = ["E", "W", "F", "I", "B", "UP", "DJ"]

[tool.pytest.ini_options]
# Diz ao pytest-django qual settings usar.
DJANGO_SETTINGS_MODULE = "config.settings"
# Arquivos onde o pytest procura testes.
python_files = ["tests.py", "test_*.py"]
# A pasta staticfiles/ só existe depois do collectstatic (no deploy).
filterwarnings = ["ignore:No directory at:UserWarning"]
