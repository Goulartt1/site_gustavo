# Integração contínua: roda lint, formatação e testes em uma máquina Linux
# do GitHub a cada pull request e a cada push na main.
name: CI

on:
  # Pull requests (qualquer branch de origem) e pushes na main (depois do merge).
  # Push em branches de PR não está aqui para não rodar tudo duas vezes.
  pull_request:
  push:
    branches: [main]

jobs:
  qualidade:
    name: Lint, formatação e testes
    runs-on: ubuntu-latest

    # Serviço: um PostgreSQL 18 rodando num contêiner ao lado do job, igual
    # ao banco de produção. Existe só durante esta execução e some no fim.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: site_gustavo
          POSTGRES_PASSWORD: senha-usada-apenas-no-ci
          POSTGRES_DB: site_gustavo
        ports:
          - 5432:5432
        # Espera o banco aceitar conexões antes de começar os passos.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Valores só para o CI: esta máquina roda testes e é descartada no fim,
      # então a chave e a senha não precisam ser secretas (não são as de produção).
      SECRET_KEY: chave-falsa-usada-apenas-no-ci
      DEBUG: "False"
      DATABASE_URL: postgres://site_gustavo:senha-usada-apenas-no-ci@localhost:5432/site_gustavo

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar o uv
        uses: astral-sh/setup-uv@v6

      # --locked: falha se o uv.lock estiver desatualizado em relação ao
      # pyproject.toml (ex.: alguém editou dependências e esqueceu o lock).
      # O uv instala o Python indicado em .python-version.
      - name: Instalar dependências
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Formatação (ruff format --check)
        run: uv run ruff format --check .

      - name: Testes (pytest)
        run: uv run pytest

      # Mesma checagem de segurança que o Django recomenda antes de publicar.
      - name: Checagem de deploy (manage.py check --deploy)
        run: uv run python manage.py check --deploy --fail-level WARNING
